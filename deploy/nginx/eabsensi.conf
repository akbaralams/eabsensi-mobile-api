# Contoh nginx: satu domain, TLS di nginx (atau di F5 di depannya).
#   /api/*   -> service Rust (eabsensi-mobile-api), beberapa instance
#   lainnya  -> Laravel (eabsensi-v2) lewat PHP-FPM
#
# CUTOVER  : aktifkan blok "location /api/" di bawah, `nginx -t && systemctl reload nginx`.
# ROLLBACK : komentari blok "location /api/" lalu reload; /api kembali ditangani Laravel lewat
#            "location /". Token tetap berlaku di kedua sisi (format Sanctum), pengguna tidak logout.

upstream eabsensi_mobile_api {
    # Request diarahkan ke instance dengan koneksi aktif paling sedikit; tidak perlu sticky session
    # (service stateless: token dibaca dari database di setiap request).
    least_conn;
    server 127.0.0.1:8080 max_fails=3 fail_timeout=10s;
    server 127.0.0.1:8081 max_fails=3 fail_timeout=10s;
    # server 10.20.0.12:8080 max_fails=3 fail_timeout=10s;   # instance di host lain
    keepalive 64;
}

server {
    listen 80;
    server_name absensi.example.go.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name absensi.example.go.id;

    ssl_certificate     /etc/ssl/certs/absensi.example.go.id.crt;
    ssl_certificate_key /etc/ssl/private/absensi.example.go.id.key;
    ssl_session_cache   shared:SSL:20m;   # session resumption: lebih murah saat lonjakan koneksi pagi
    ssl_session_timeout 1h;

    root /var/www/eabsensi-v2/public;
    index index.php;

    # Foto maks 4 MB + field lain. Service sendiri menolak body > 5 MB dengan JSON 413.
    client_max_body_size 6m;

    location /api/ {
        proxy_pass http://eabsensi_mobile_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Service hanya membaca X-Forwarded-* dari TRUSTED_PROXIES (alamat nginx ini).
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;

        # nginx menampung unggahan dulu (default), jadi klien lambat tidak menahan slot service.
        proxy_request_buffering on;
        proxy_connect_timeout 3s;
        proxy_send_timeout 70s;
        proxy_read_timeout 70s;   # sedikit di atas REQUEST_TIMEOUT_SECS (60)

        # Coba instance lain hanya bila koneksi gagal (request POST tidak diulang setelah terkirim).
        proxy_next_upstream error timeout;
    }

    # Health check service (untuk monitor internal; jangan dibuka ke publik bila tidak perlu).
    location = /healthz {
        allow 127.0.0.1;
        allow 10.0.0.0/8;
        deny all;
        proxy_pass http://eabsensi_mobile_api;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass unix:/run/php/php8.5-fpm.sock;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
