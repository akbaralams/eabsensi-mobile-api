name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  DATABASE_URL: postgres://eabsensi:eabsensi@localhost:5432/eabsensi_test
  HURL_VERSION: 8.1.0
  REDOCLY_VERSION: 2.72.0

jobs:
  rust:
    name: fmt, clippy, sqlx, test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: eabsensi
          POSTGRES_PASSWORD: eabsensi
          POSTGRES_DB: eabsensi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eabsensi" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8
        ports: ['6379:6379']
    env:
      TEST_REDIS_URL: redis://localhost:6379/15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Muat dump skema (versi di SCHEMA_VERSION)
        # psql di dalam kontainer: dump memakai meta-command \restrict yang butuh psql 18.
        run: docker exec -i ${{ job.services.postgres.id }} psql -U eabsensi -d eabsensi_test -v ON_ERROR_STOP=1 -q < schema/pgsql-schema.sql
      - run: cargo install sqlx-cli --no-default-features --features rustls,postgres --locked
      - name: Query cocok dengan skema dan metadata offline .sqlx/ mutakhir
        run: cargo sqlx prepare --check -- --all-targets
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - name: Test (unit + integrasi terhadap Postgres)
        run: cargo test --all-targets

  openapi:
    name: lint OpenAPI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - run: npx --yes @redocly/cli@${REDOCLY_VERSION} lint --config docs/redocly.yaml docs/openapi.yaml

  contract:
    name: suite kontrak (Hurl) terhadap binary
    runs-on: ubuntu-latest
    needs: rust
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: eabsensi
          POSTGRES_PASSWORD: eabsensi
          POSTGRES_DB: eabsensi_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U eabsensi" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      SQLX_OFFLINE: 'true'
      LISTEN_ADDR: 127.0.0.1:8080
      PHOTO_ROOT: ${{ github.workspace }}/target/photos
      LOG_FORMAT: json
      ATTENDANCE_TIMEZONE: Asia/Jakarta
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Muat dump skema
        run: docker exec -i ${{ job.services.postgres.id }} psql -U eabsensi -d eabsensi_test -v ON_ERROR_STOP=1 -q < schema/pgsql-schema.sql
      - name: Pasang Hurl
        run: |
          curl -fsSL -o hurl.deb "https://github.com/Orange-OpenSource/hurl/releases/download/${HURL_VERSION}/hurl_${HURL_VERSION}_amd64.deb"
          sudo apt-get install -y ./hurl.deb
      - run: cargo build --release --locked
      - name: Jalankan service
        run: |
          ./target/release/eabsensi-mobile-api > service.log 2>&1 &
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8080/healthz && break; sleep 1; done
      - name: Suite kontrak
        run: BASE_URL=http://127.0.0.1:8080 INCLUDE_V2=1 bash scripts/contract-test.sh
      - name: Log service
        if: always()
        run: cat service.log
