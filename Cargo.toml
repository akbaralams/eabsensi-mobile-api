[package]
name = "eabsensi-mobile-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["multipart", "macros"] }
bcrypt = "0.19.3"
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
chrono-tz = "0.10.4"
crc32fast = "1.5.3"
dotenvy = "0.15.7"
form_urlencoded = "1.2.2"
hex = "0.4.3"
http-body-util = "0.1.5"
infer = "0.22.0"
mime = "0.3.17"
rand = "0.10.3"
redis = { version = "1.8.0", default-features = false, features = ["tokio-comp", "aio", "connection-manager", "script"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = { version = "1.0.154", features = ["preserve_order"] }
sha2 = "0.11.1"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "chrono", "json"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "signal", "fs", "time", "sync"] }
tower = { version = "0.5.3", features = ["util", "limit", "timeout"] }
tower-http = { version = "0.7.1", features = ["trace", "request-id", "timeout", "limit", "util", "catch-panic", "sensitive-headers", "cors", "set-header", "normalize-path"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["json", "env-filter", "fmt"] }

[dev-dependencies]
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "macros", "chrono", "json", "migrate"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "test-util"] }
